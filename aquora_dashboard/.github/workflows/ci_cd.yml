name: Aquora CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  # =========================================================================
  # 1. Backend Integration & Big Data Pipeline Validation
  # =========================================================================
  backend-tests:
    name: Backend Test Pipeline (Python 3.10)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Geospatial & NetCDF System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libhdf5-dev \
            libnetcdf-dev \
            gdal-bin \
            libgdal-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run Big Data & Spectral Triage Test Suite
        run: |
          python test_pipeline.py

  # =========================================================================
  # 2. Frontend Build & Static Asset Compilation
  # =========================================================================
  frontend-build:
    name: Frontend Build & Verification (Node.js 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package.json'

      - name: Install NPM Dependencies
        run: |
          npm ci || npm install

      - name: Install Playwright Browsers
        run: |
          npx playwright install --with-deps chromium

      - name: Execute Playwright E2E Test Suite
        run: |
          npm run test:e2e

      - name: Build Web-GIS Production Distribution
        run: |
          npm run build

  # =========================================================================
  # 3. Docker Buildx & Container Orchestration Verification
  # =========================================================================
  docker-build:
    name: Docker Buildx & Compose Verification
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: aquora-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Nginx Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: aquora-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config

      - name: Build Multi-Container Stack via Compose
        run: |
          docker compose build
